<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B08D57" />
    <meta
      name="description"
      content="Mon Celebra — Créez et partagez une page interactive pour votre mariage, anniversaire ou baptême. Chaque moment mérite d'être célébré."
    />
    <title>Mon Celebra — Chaque moment mérite d'être célébré</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('celebra-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#111827';
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
